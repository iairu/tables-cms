[package]
name = "tables-cms"
version = "1.0.0"
description = "TABLES CMS - Content Management System built with Tauri"
authors = ["TABLES Team"]
license = "MIT"
repository = "https://github.com/tables/tables-cms"
edition = "2021"
rust-version = "1.77.2"

# macOS 12.0+ target
[package.metadata.cargo-machete]
ignored = ["serde", "serde_json"]

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
dirs = "5"
uuid = { version = "1.0", features = ["v4"] }
base64 = "0.21"
tokio = { version = "1", features = ["full"] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
